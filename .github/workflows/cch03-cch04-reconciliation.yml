name: CCH-03 and CCH-04 integration

on:
  push:
    branches:
      - integration/cch-03-cch-04-2026-11-23
  pull_request:
    branches: [main]
    paths:
      - engine/game_engine.py
      - engine/coach_tactics.py
      - engine/team_installation.py
      - engine/dynasty.py
      - engine/season.py
      - tests/test_cch03_cch04_reconciliation.py
      - tests/test_team_installation.py
      - .github/workflows/cch03-cch04-reconciliation.yml

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - name: Check DC familiarity bridge and package installation
        run: python -m pytest tests/test_cch03_cch04_reconciliation.py tests/test_team_installation.py tests/test_coach_tactics_defense.py tests/test_dynasty_program_count.py -q
      - name: Full regression suite
        run: python -m pytest tests/ -q

  matched-games:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Reproduce OC installation decisions with five familiarity states
        run: python scripts/benchmark_team_installation.py --games 80 --out reports/cch04-integrated
      - name: Reproduce DC choices across two schemes
        run: python scripts/benchmark_defensive_coaches.py --games 40 --seed 20261123 --out reports/cch03-integrated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cch03-cch04-integrated-benchmarks
          path: |
            reports/cch04-integrated/
            reports/cch03-integrated/
          if-no-files-found: error
          retention-days: 90

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install React dependencies
        run: npm ci
        working-directory: web
      - name: Typecheck and build updated installation panel
        run: npm run build
        working-directory: web
