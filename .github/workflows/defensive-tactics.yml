name: Defensive tactics regression tests

on:
  push:
    branches:
      - fix/defensive-tactics-def-01-02-03
  pull_request:
    branches:
      - main
      - claude/fix-league-hub-null-status
    paths:
      - engine/game_engine.py
      - tests/test_defensive_tactics.py
      - .github/workflows/defensive-tactics.yml

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - name: DEF-01/02/03 targeted tests
        run: python -m pytest tests/test_defensive_tactics.py -q
      - name: Existing engine test suite
        run: python -m pytest tests/ -q
      - name: Paired defensive scheme benchmark
        run: python scripts/compare_defense_wiring.py --games 80 --seed 2026
