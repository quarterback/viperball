name: Deploy to Fly.io

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.doc/**'
      - 'docs/**'
  workflow_dispatch:  # manual trigger from GitHub Actions UI

jobs:
  # Build validation — catch Docker build failures before deploying
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Dockerfile builds
        run: docker build --tag viperball-test .

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt..."
            if flyctl deploy --remote-only --build-arg VIPERBALL_BUILD_SHA="${GITHUB_SHA}"; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep_time=$((attempt * 10))
              echo "Deploy failed, retrying in ${sleep_time}s..."
              sleep "$sleep_time"
            fi
          done
          echo "Deploy failed after 3 attempts"
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment health
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          for attempt in 1 2 3 4 5; do
            echo "Health check attempt $attempt..."
            status=$(curl -s -o /dev/null -w "%{http_code}" https://viperball.fly.dev/api/health || true)
            if [ "$status" = "200" ]; then
              sha=$(curl -fsS https://viperball.fly.dev/api/health | python -c 'import json,sys; print(json.load(sys.stdin).get("build_sha","unknown"))')
              if [ "$sha" = "$GITHUB_SHA" ]; then
                echo "Health and deployed build SHA verified: $sha"
                exit 0
              fi
              echo "Health returned 200 but build SHA differs: $sha != $GITHUB_SHA"
            fi
            echo "Got HTTP $status, retrying in 15s..."
            sleep 15
          done
          echo "WARNING: Health check did not return 200 after 5 attempts"
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
