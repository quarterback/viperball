name: Coach tactical decisions CCH-02

on:
  push:
    branches:
      - feature/coach-tactics-gameplay-cch-02
  pull_request:
    branches:
      - main
      - feature/coach-tactical-identity-cch-01
    paths:
      - engine/game_engine.py
      - engine/coach_tactics.py
      - tests/test_coach_tactics_gameplay.py
      - scripts/benchmark_coach_tactics.py
      - .github/workflows/coach-tactics-gameplay.yml

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - name: CCH-02 unit tests and full-game smoke
        run: python -m pytest tests/test_coach_tactics_gameplay.py -q
      - name: Existing regression suite
        run: python -m pytest tests/ -q

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Same-scheme matched coach simulation and ablation
        run: python scripts/benchmark_coach_tactics.py --games 80 --seed 20261123 --out reports/cch02
      - name: Preserve coach selection distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cch02-coach-identity-matched-benchmark
          path: reports/cch02/
          if-no-files-found: error
          retention-days: 90
