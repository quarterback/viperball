name: Integrated engine calibration
on:
  pull_request:
    branches: [main]
    paths:
      - engine/game_engine.py
      - engine/team_installation.py
      - engine/defensive_commitments.py
      - data/playbooks/packages.json
      - scripts/benchmark_defensive_packages.py
      - scripts/benchmark_rare_tactics.py
      - scripts/benchmark_dynasty_tactics.py
      - engine/db.py
      - engine/dynasty.py
      - .github/workflows/engine-integrated-calibration.yml
  workflow_dispatch:
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Combined engine smoke and calibration
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ] && git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -Fxq scripts/benchmark_dynasty_tactics.py; then
            python scripts/benchmark_dynasty_tactics.py --seasons 3 --teams 16 --out reports/integrated-defense
          elif [ -n "$PR_BASE" ] && git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -Fxq scripts/benchmark_rare_tactics.py; then
            python scripts/benchmark_rare_tactics.py --games 48 --cap 120 --out reports/integrated-defense
          else
            python scripts/benchmark_defensive_packages.py --games 24 --out reports/integrated-defense
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-defense
          path: reports/integrated-defense/
