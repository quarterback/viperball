name: Integrated engine calibration
on:
  pull_request:
    branches: [main]
    paths:
      - engine/game_engine.py
      - engine/team_installation.py
      - engine/defensive_commitments.py
      - data/playbooks/packages.json
      - scripts/benchmark_defensive_packages.py
      - scripts/benchmark_rare_tactics.py
      - scripts/benchmark_offensive_packages.py
      - scripts/benchmark_dynasty_tactics.py
      - scripts/benchmark_national_dynasty.py
      - engine/db.py
      - engine/dynasty.py
      - engine/college_feeder.py
      - engine/hs_league.py
      - engine/weather.py
      - tests/test_weather_model.py
      - engine/coach_learning.py
      - tests/test_coach_learning.py
      - tests/test_snap_participation.py
      - tests/test_college_cohort_continuity.py
      - engine/recruiting.py
      - engine/roster_continuity.py
      - engine/player_card.py
      - api/main.py
      - tests/test_college_feeder_identity.py
      - tests/test_scale_cutoffs.py
      - .github/workflows/engine-integrated-calibration.yml
  workflow_dispatch:
    inputs:
      run_national:
        description: Run full national dynasty validation
        type: boolean
        default: false
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      run_national: ${{ steps.national-scope.outputs.enabled }}
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: national-scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MANUAL: ${{ inputs.run_national }}
        run: |
          enabled=false
          if [ "$MANUAL" = "true" ]; then
            enabled=true
          elif [ -n "$PR_BASE" ] && git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -E '^scripts/benchmark_(national_dynasty|dynasty_tactics)\.py$|^engine/(college_feeder|hs_league|dynasty|roster_continuity|recruiting|weather)\.py$|^\.github/workflows/engine-integrated-calibration\.yml$' > /dev/null; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - run: python -m pip install -r requirements.txt pytest
      - name: College feeder and rating-scale regressions
        run: python -m pytest -q tests/test_college_feeder_identity.py tests/test_scale_cutoffs.py tests/test_college_cohort_continuity.py tests/test_weather_model.py tests/test_coach_learning.py tests/test_snap_participation.py
      - name: Combined engine smoke and calibration
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_NATIONAL: ${{ steps.national-scope.outputs.enabled }}
        run: |
          changed() {
            [ -n "$PR_BASE" ] && git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -Fxq "$1"
          }
          if [ "$RUN_NATIONAL" = "true" ] || changed scripts/benchmark_dynasty_tactics.py; then
            failed=0
            for seed in 20261124 20261125 20261126; do
              python scripts/benchmark_dynasty_tactics.py --seasons 3 --teams 16 --seed "$seed" --out "reports/integrated-defense/dynasty-$seed" || failed=1
            done
            if [ "$RUN_NATIONAL" = "true" ] || changed scripts/benchmark_rare_tactics.py; then
              python scripts/benchmark_rare_tactics.py --games 48 --cap 120 --out reports/integrated-defense/rare || failed=1
            fi
            exit "$failed"
          elif changed scripts/benchmark_rare_tactics.py; then
            python scripts/benchmark_rare_tactics.py --games 48 --cap 120 --out reports/integrated-defense
          else
            python scripts/benchmark_defensive_packages.py --games 24 --out reports/integrated-defense
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-defense
          path: reports/integrated-defense/

  national:
    needs: integrated
    if: needs.integrated.outputs.run_national == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [20261124, 20261125]
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: National two-season dynasty
        run: python scripts/benchmark_national_dynasty.py --seed ${{ matrix.seed }} --out reports/national-dynasty
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: national-dynasty-${{ matrix.seed }}
          path: reports/national-dynasty/

  offensive-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Paired offensive package policy study
        run: python scripts/benchmark_offensive_packages.py --seeds 2 --out reports/offensive-calibration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offensive-calibration
          path: reports/offensive-calibration/
