name: DEF-06 complete defensive matchup study

on:
  push:
    branches:
      - analysis/def-06-full-matchup-matrix
  pull_request:
    branches:
      - fix/defensive-tactics-def-01-02-03
      - claude/fix-league-hub-null-status
      - main
    paths:
      - scripts/defense_matchup_matrix.py
      - tests/test_defense_matchup_matrix.py
      - .github/workflows/def-06-matchup-matrix.yml

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - name: Matrix contract tests and full-engine smoke
        run: python -m pytest tests/test_defense_matchup_matrix.py -q
      - name: Existing engine tests
        run: python -m pytest tests/ -q

  factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: All 16 offenses × eight defenses × four forced formations × two defensive rosters × mirrored venues
        run: |
          python scripts/defense_matchup_matrix.py \
            --seed 20261123 --reps 1 --out reports/def06
      - name: Upload full observation and matchup tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: def06-full-matrix
          path: reports/def06/
          if-no-files-found: error
          retention-days: 90

  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Targeted clear-vs-rain test across representative offensive philosophies
        run: |
          python scripts/defense_matchup_matrix.py \
            --seed 20261123 --reps 2 \
            --offenses boot_raid,ground_pound,chain_gang,shock_and_awe \
            --formations split,spread --weathers clear,rain \
            --out reports/def06-weather
      - name: Upload weather sensitivity tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: def06-weather-sensitivity
          path: reports/def06-weather/
          if-no-files-found: error
          retention-days: 90
